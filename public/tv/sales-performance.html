<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Monitoring Performance</title>
<style>
  /* Plain, old-browser-safe CSS only: no oklch/color-mix/@layer/:where/@property. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ffffff; color: #171717;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; padding: 16px; }

  .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; }
  .brand img { width: 44px; height: 44px; object-fit: contain; margin-right: 14px; }
  .brand h1 { font-size: 22px; font-weight: bold; margin: 0; color: #171717; }
  .brand p { font-size: 13px; color: #737373; margin: 2px 0 0 0; }

  .filters { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; }
  .field span { font-size: 12px; font-weight: bold; color: #404040; margin-bottom: 4px; }
  .field select {
    font-size: 14px; padding: 6px 8px; border: 1px solid #d4d4d4; border-radius: 6px;
    background: #ffffff; color: #171717; min-width: 120px;
  }

  /* Outer frame: horizontal scroll shared by head/body/foot (kept in sync by equal widths). */
  .tv-table {
    border: 1px solid #d4d4d4; border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .grid { table-layout: fixed; border-collapse: collapse; }
  .grid th, .grid td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  thead th {
    background: #f8fafc; color: #0f172a; font-weight: 800; font-size: 18px;
    padding: 12px 8px; border-bottom: 2px solid #e2e8f0; text-align: left;
  }
  tbody td { padding: 11px 8px; font-size: 16px; color: #1f2937; border-bottom: 1px solid #f1f5f9; }
  tbody tr:nth-child(even) { background: #fafbfc; }
  tfoot td {
    background: #f8fafc; font-weight: 800; padding: 12px 8px;
    border-top: 2px solid #e2e8f0; font-size: 20px; text-align: center; color: #0f172a;
  }
  tfoot td.foot-label { text-align: left; }
  .col-num { text-align: center; }
  .col-total { text-align: center; font-weight: 800; }
  /* Tight horizontal padding so a full month of columns fits without clipping */
  thead th.col-num, tbody td.col-num, tfoot td.col-num { padding-left: 2px; padding-right: 2px; }

  /* Big, bold, centered numbers for the value cells */
  tbody td.col-num { font-size: 22px; font-weight: 800; color: #0f172a; }
  tbody td.col-total { font-size: 24px; font-weight: 800; color: #0f172a; }
  thead th.col-num, thead th.col-total { font-size: 16px; text-align: center; }
  tfoot td.col-num { font-size: 20px; }

  /* Holiday (Sunday / listed) columns in red */
  thead th.holiday { color: #dc2626; }
  tbody td.holiday, tfoot td.holiday { background: #fef2f2; color: #dc2626; }

  /* Zero values dimmed */
  tbody td.zero { color: #cbd5e1; font-weight: 700; }
  tbody td.zero.holiday { color: #fca5a5; }

  /* Body viewport: fixed height (from JS) + hidden overflow; the track is animated. */
  .body-wrap { overflow: hidden; }
  .scroll-track { -webkit-transform: translateY(0); transform: translateY(0); will-change: transform; }

  .name-cell { display: flex; align-items: center; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; margin-right: 12px; flex: 0 0 auto;
    background: #f1f5f9; border: 1px solid #e2e8f0; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; color: #475569; font-size: 16px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name-text { min-width: 0; overflow: hidden; }
  .name-main { font-size: 17px; font-weight: 800; color: #0f172a; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
  .name-sub { font-size: 13px; color: #64748b; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }

  .state { padding: 24px; text-align: center; color: #737373; font-size: 15px; }
</style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="brand">
        <img src="/logo.png" alt="Logo" onerror="this.style.display='none'">
        <div>
          <h1>Daily monitoring Performance</h1>
          <p id="subtitle">Daily sales performance heatmap</p>
        </div>
      </div>
      <div class="filters">
        <label class="field"><span>Type</span><select id="f-type"></select></label>
        <label class="field"><span>Cabang</span><select id="f-branch"></select></label>
        <label class="field"><span>Team</span><select id="f-team"></select></label>
        <label class="field"><span>Refresh</span><select id="f-refresh"></select></label>
      </div>
    </div>

    <div class="tv-table" id="tv-table" style="flex:1 1 auto; min-height:0;">
      <div class="state" id="state">Memuat data...</div>
      <table class="grid" id="head-table" style="display:none"><colgroup id="cg-head"></colgroup><thead><tr id="thead-row"></tr></thead></table>
      <div class="body-wrap" id="body-wrap" style="display:none">
        <div class="scroll-track" id="scroll-track">
          <table class="grid" id="body-table"><colgroup id="cg-body"></colgroup><tbody id="tbody"></tbody></table>
        </div>
      </div>
      <table class="grid" id="foot-table" style="display:none"><colgroup id="cg-foot"></colgroup><tfoot><tr id="tfoot-row"></tr></tfoot></table>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ---- API base: ?api=... overrides; otherwise same-origin /api ----
  var DEFAULT_API_BASE = '/api';
  var query = new URLSearchParams(window.location.search);
  var API_BASE = (query.get('api') || DEFAULT_API_BASE).replace(/\/+$/, '');
  var SPEED = Number(query.get('speed')) || 40; // px per second

  // Column widths (px) — Name & Total fixed; day columns share the remaining
  // width equally so a full month (up to 31 days) always fits without scroll.
  var W_NAME = 220, W_TOTAL = 78;

  // Holidays: Sundays plus any national dates passed as
  // ?holidays=2026-08-17,2026-12-25 (ISO yyyy-mm-dd).
  var HOLIDAY_SET = {};
  (query.get('holidays') || '').split(',').forEach(function (s) { s = s.trim(); if (s) HOLIDAY_SET[s] = true; });
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isHoliday(year, monthIndex, d) {
    if (new Date(year, monthIndex, d).getDay() === 0) return true; // Sunday
    return !!HOLIDAY_SET[year + '-' + pad2(monthIndex + 1) + '-' + pad2(d)];
  }

  // ---- Options ----
  var typeOptions = [
    { label: 'Semua Type', value: 'all' },
    { label: 'Access Home', value: 'access_home' },
    { label: 'Access Business', value: 'access_business' }
  ];
  var branchOptions = [
    { label: 'Semua Cabang', value: 'all' },
    { label: 'Medan', value: '020-CABANG' },
    { label: 'Jakarta', value: '025' },
    { label: 'Bali', value: '062' },
    { label: 'Binjai', value: '027' },
    { label: 'Tanjung Morawa', value: '029' }
  ];
  var refreshOptions = [
    { label: 'Nonaktif', value: '0' },
    { label: '10 Detik', value: '10s' },
    { label: '1 Menit', value: '1m' },
    { label: '1 Jam', value: '1h' },
    { label: '1 Hari', value: '1d' }
  ];

  // ---- State (initial values from URL) ----
  function pick(key, allowed, fallback) {
    var v = query.get(key);
    if (v && allowed.indexOf(v) !== -1) return v;
    return fallback;
  }
  var state = {
    type: pick('type', typeOptions.map(function (o) { return o.value; }), 'all'),
    branch: pick('branchId', branchOptions.map(function (o) { return o.value; }), 'all'),
    team: query.get('team') || 'all',
    refresh: pick('refresh', refreshOptions.map(function (o) { return o.value; }), '1h')
  };
  var managers = [];

  // ---- DOM refs ----
  var elType = document.getElementById('f-type');
  var elBranch = document.getElementById('f-branch');
  var elTeam = document.getElementById('f-team');
  var elRefresh = document.getElementById('f-refresh');
  var elState = document.getElementById('state');
  var elHeadTable = document.getElementById('head-table');
  var elFootTable = document.getElementById('foot-table');
  var elBodyWrap = document.getElementById('body-wrap');
  var elTrack = document.getElementById('scroll-track');
  var elBodyTable = document.getElementById('body-table');
  var elCgHead = document.getElementById('cg-head');
  var elCgBody = document.getElementById('cg-body');
  var elCgFoot = document.getElementById('cg-foot');
  var elTheadRow = document.getElementById('thead-row');
  var elTbody = document.getElementById('tbody');
  var elTfootRow = document.getElementById('tfoot-row');
  var elSubtitle = document.getElementById('subtitle');

  function fillSelect(el, options, value) {
    el.innerHTML = '';
    options.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o.value; opt.textContent = o.label; el.appendChild(opt);
    });
    el.value = value;
  }
  function teamOptions() {
    var opts = [{ label: 'Semua Tim', value: 'all' }];
    managers.forEach(function (m) { opts.push({ label: m.name, value: String(m.id) }); });
    return opts;
  }
  function syncUrl() {
    var q = new URLSearchParams();
    if (state.type !== 'all') q.set('type', state.type);
    if (state.branch !== 'all') q.set('branchId', state.branch);
    if (state.team !== 'all') q.set('team', state.team);
    if (state.refresh !== '1h') q.set('refresh', state.refresh);
    if (query.get('api')) q.set('api', query.get('api'));
    if (query.get('speed')) q.set('speed', query.get('speed'));
    var s = q.toString();
    history.replaceState(null, '', s ? ('?' + s) : window.location.pathname);
  }
  function getJSON(url) {
    return fetch(url, { headers: { 'Accept': 'application/json' } }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function fetchManagers() {
    var url = API_BASE + '/public/sales-performance/manager';
    if (state.type !== 'all') url += '?type=' + encodeURIComponent(state.type);
    return getJSON(url).then(function (res) {
      managers = (res && res.success && res.data) ? res.data : [];
    }).catch(function () { managers = []; });
  }
  function fetchData() {
    var q = new URLSearchParams();
    if (state.team !== 'all') q.set('managerId', state.team);
    if (state.branch !== 'all') q.set('branchId', state.branch);
    if (state.type !== 'all') q.set('type', state.type);
    var qs = q.toString();
    var url = API_BASE + '/public/sales-performance' + (qs ? ('?' + qs) : '');
    return getJSON(url).then(function (res) {
      return (res && res.success && res.data) ? res.data : [];
    });
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function initials(name) {
    var n = (name || '').trim();
    return n ? n.charAt(0).toUpperCase() : '?';
  }
  function colgroupHtml(day) {
    var h = '<col style="width:' + W_NAME + 'px"><col style="width:' + W_TOTAL + 'px">'; // Name & Total fixed
    for (var d = 1; d <= day; d++) h += '<col>'; // day columns share remaining width equally
    return h;
  }

  function render(rows) {
    var now = new Date();
    var Y = now.getFullYear(), M = now.getMonth();
    var day = now.getDate();

    if (!rows.length) {
      elHeadTable.style.display = 'none';
      elBodyWrap.style.display = 'none';
      elFootTable.style.display = 'none';
      elState.style.display = 'block';
      elState.textContent = 'Tidak ada data.';
      stopScroll();
      return;
    }
    elState.style.display = 'none';
    elHeadTable.style.display = 'table';
    elBodyWrap.style.display = 'block';
    elFootTable.style.display = 'table';

    // widths — full width; Name column (auto) absorbs the remaining space
    elHeadTable.style.width = '100%';
    elBodyTable.style.width = '100%';
    elFootTable.style.width = '100%';
    elCgHead.innerHTML = colgroupHtml(day);
    elCgBody.innerHTML = colgroupHtml(day);
    elCgFoot.innerHTML = colgroupHtml(day);

    // header
    var head = '<th>Name</th><th class="col-total">Total</th>';
    for (var d = 1; d <= day; d++) {
      head += '<th class="col-num' + (isHoliday(Y, M, d) ? ' holiday' : '') + '">' + d + '</th>';
    }
    elTheadRow.innerHTML = head;

    // body + column totals
    var colTotals = []; for (var i = 0; i <= day; i++) colTotals[i] = 0;
    var body = '';
    rows.forEach(function (row) {
      var data = row.data || [];
      var rowTotal = 0;
      for (var k = 0; k < data.length; k++) rowTotal += Number(data[k]) || 0;
      colTotals[0] += rowTotal;

      var avatar = row.photoProfile
        ? '<span class="avatar"><img src="' + escapeHtml(row.photoProfile) + '" alt="" onerror="this.parentNode.textContent=\'' + escapeHtml(initials(row.name)) + '\'"></span>'
        : '<span class="avatar">' + escapeHtml(initials(row.name)) + '</span>';

      var cells = '<td><div class="name-cell">' + avatar +
        '<span class="name-text"><div class="name-main">' + escapeHtml(row.name) + '</div>' +
        '<div class="name-sub">' + escapeHtml(row.organizationName || '') + '</div></span></div></td>';
      cells += '<td class="col-total">' + rowTotal + '</td>';
      for (var d2 = 1; d2 <= day; d2++) {
        var val = Number(data[d2 - 1]) || 0;
        colTotals[d2] += val;
        var cls = 'col-num';
        if (isHoliday(Y, M, d2)) cls += ' holiday';
        if (val === 0) cls += ' zero';
        cells += '<td class="' + cls + '">' + val + '</td>';
      }
      body += '<tr>' + cells + '</tr>';
    });
    elTbody.innerHTML = body;

    // footer
    var foot = '<td class="foot-label">Total</td><td class="col-total">' + colTotals[0] + '</td>';
    for (var f = 1; f <= day; f++) {
      foot += '<td class="col-num' + (isHoliday(Y, M, f) ? ' holiday' : '') + '">' + colTotals[f] + '</td>';
    }
    elTfootRow.innerHTML = foot;

    fitHeight();
    setupScroll();
  }

  function updateSubtitle() {
    var now = new Date();
    var monthYear = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    elSubtitle.textContent = 'Daily sales performance heatmap 🔥 • ' + monthYear;
  }

  // ---- Fixed body-viewport height (independent of flex/100vh quirks) ----
  function fitHeight() {
    var top = elBodyWrap.getBoundingClientRect().top;
    var footH = elFootTable.offsetHeight || 0;
    var h = window.innerHeight - top - footH - 16; // 16 = #app bottom padding
    if (h < 120) h = 120;
    elBodyWrap.style.height = h + 'px';
  }

  // ---- Scroll via JS-driven transform ----
  // Forced: keeps moving regardless of hover, timer throttling, scrollTop
  // support, or Page Visibility (setInterval still fires when hidden).
  // Time-based delta => constant speed even if ticks are throttled.
  var sDist = 0, sPos = 0, sLast = 0, sPhase = 'pauseTop', sPauseUntil = 0;
  function applyPos() {
    var v = 'translateY(-' + sPos + 'px)';
    elTrack.style.transform = v;
    elTrack.style.webkitTransform = v;
  }
  function stopScroll() { sPos = 0; applyPos(); }
  function setupScroll() {
    sDist = elBodyTable.offsetHeight - elBodyWrap.clientHeight;
    if (sDist < 0) sDist = 0;
    sPos = 0; applyPos();
    sLast = 0; sPhase = 'pauseTop'; sPauseUntil = Date.now() + 1000;
  }
  function tick() {
    var now = Date.now();
    if (!sLast) sLast = now;
    var dt = (now - sLast) / 1000; sLast = now;
    if (dt > 1) dt = 1; // cap so a throttled (hidden) tick still advances
    if (sDist <= 0) return;
    if (sPhase === 'pauseTop') { if (now >= sPauseUntil) sPhase = 'run'; return; }
    if (sPhase === 'pauseBottom') {
      if (now >= sPauseUntil) { sPos = 0; applyPos(); sPhase = 'pauseTop'; sPauseUntil = now + 1000; }
      return;
    }
    sPos += SPEED * dt;
    if (sPos >= sDist) { sPos = sDist; applyPos(); sPhase = 'pauseBottom'; sPauseUntil = now + 1500; return; }
    applyPos();
  }
  setInterval(tick, 30);
  window.addEventListener('resize', function () { fitHeight(); setupScroll(); });

  var loading = false;
  function reload() {
    if (loading) return Promise.resolve();
    loading = true;
    return fetchData().then(function (rows) {
      render(rows); updateSubtitle();
    }).catch(function () {
      elHeadTable.style.display = 'none';
      elBodyWrap.style.display = 'none';
      elFootTable.style.display = 'none';
      elState.style.display = 'block';
      elState.textContent = 'Gagal memuat data. Periksa koneksi / API (' + API_BASE + ').';
      stopScroll();
    }).then(function () { loading = false; });
  }

  // ---- Auto refresh ----
  var refreshTimer = null;
  function startRefresh() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    var ms = 0;
    if (state.refresh === '10s') ms = 10000;
    else if (state.refresh === '1m') ms = 60000;
    else if (state.refresh === '1h') ms = 3600000;
    else if (state.refresh === '1d') ms = 86400000;
    if (ms > 0) refreshTimer = setInterval(reload, ms);
  }

  // ---- Wire up filters ----
  fillSelect(elType, typeOptions, state.type);
  fillSelect(elBranch, branchOptions, state.branch);
  fillSelect(elRefresh, refreshOptions, state.refresh);
  function refreshTeamSelect() { fillSelect(elTeam, teamOptions(), state.team); }

  elType.addEventListener('change', function () {
    state.type = elType.value; state.team = 'all'; syncUrl();
    fetchManagers().then(function () { refreshTeamSelect(); reload(); });
  });
  elBranch.addEventListener('change', function () { state.branch = elBranch.value; syncUrl(); reload(); });
  elTeam.addEventListener('change', function () { state.team = elTeam.value; syncUrl(); reload(); });
  elRefresh.addEventListener('change', function () { state.refresh = elRefresh.value; syncUrl(); startRefresh(); });

  // ---- Init ----
  fetchManagers().then(function () {
    refreshTeamSelect();
    return reload();
  }).then(function () {
    startRefresh();
    // Re-fit once more after layout settles (fonts/images).
    setTimeout(function () { fitHeight(); setupScroll(); }, 800);
  });
})();
</script>
</body>
</html>
